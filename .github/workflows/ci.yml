name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default -DTIDE_MARKS_ENABLE_SQLITE=OFF

      - name: Build
        run: cmake --build --preset default -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check whitespace
        run: git diff --check

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure with SQLite adapter
        run: cmake -S . -B build-sqlite -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTIDE_MARKS_ENABLE_SQLITE=ON -DTIDE_MARKS_REQUIRE_SQLITE=ON

      - name: Build
        run: cmake --build build-sqlite -j2

      - name: Test SQLite adapter
        run: ctest --test-dir build-sqlite --output-on-failure

      - name: Check whitespace
        run: git diff --check
